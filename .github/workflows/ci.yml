name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./engine[dev]
      - name: Lint
        run: |
          cd engine && ruff check .
      - name: Tests
        run: |
          cd engine && python -m pytest --timeout=15 -q

  api:
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./engine
          pip install -e ./api[dev]
      - name: Lint
        run: |
          cd api && ruff check .
      - name: Tests
        run: |
          cd api && python -m pytest --timeout=15 -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          cd frontend && npm install --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck
        run: |
          cd frontend && npx tsc -b --noEmit
      - name: Build
        run: |
          cd frontend && npm run build
