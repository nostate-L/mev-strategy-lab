[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mevlab-api"
version = "0.1.0"
description = "REST API for MEV Strategy Lab"
authors = [{ name = "MEV Lab" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "rq>=1.16",
    "structlog>=24.1",
    "mevlab",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "PIE"]
